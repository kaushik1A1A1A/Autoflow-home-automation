# REMOVED 16-Aug-2026: "Screen OFF at Midnight" / "Screen ON at 6 AM".
# Superseded by the Auto brightness mode, which steps 80% / 20% / 5% through
# the day and evening. They were also the last things writing the backlight
# directly, which is what the single-owner rule exists to prevent.
# ==========================================
# 🤖 KITCHEN PUMP (TOP TANK) AUTOMATIONS
# ==========================================

# 1. KITCHEN: Manual & Semi-Auto - Tank Empty Alert
- id: 'kitchen_empty_alert'
  alias: "Kitchen Tank Empty Alert"
  trigger:
    - platform: state
      entity_id: binary_sensor.top_tank_empty_float
      to: "on"
  condition:
    - condition: or
      conditions:
        - condition: state
          entity_id: input_select.kitchen_pump_mode
          state: "Manual"
        - condition: state
          entity_id: input_select.kitchen_pump_mode
          state: "Semi-Auto"
  action:
    - service: script.system_alert
      data:
        message: "Warning. The kitchen tank is empty."
        sound: kitchen_empty
        audio_duration: 10
        visual_duration: 60

# 2. KITCHEN: Manual Mode - Tank Full Alert
- id: 'kitchen_manual_full_alert'
  alias: "Kitchen Tank Full Alert (Manual Mode)"
  trigger:
    - platform: state
      entity_id: binary_sensor.top_tank_full_float
      to: "on"
  condition:
    - condition: state
      entity_id: input_select.kitchen_pump_mode
      state: "Manual"
    - condition: state
      entity_id: switch.kitchen_pump
      state: "on"
  action:
    - service: script.system_alert
      data:
        message: "Warning. The kitchen tank is full, but the pump is still running in manual mode."
        sound: kitchen_full_manual
        audio_duration: 10
        visual_duration: 20

# 3. KITCHEN: Semi-Auto Mode - Auto Stop on Full
- id: 'kitchen_semiauto_stop'
  alias: "Kitchen Semi-Auto - Stop on Full"
  trigger:
    - platform: state
      entity_id: binary_sensor.top_tank_full_float
      to: "on"
  condition:
    - condition: state
      entity_id: input_select.kitchen_pump_mode
      state: "Semi-Auto"
    - condition: state
      entity_id: switch.kitchen_pump
      state: "on"
  action:
    # Alert, then wait 10 seconds before stopping pump as requested
    - service: script.system_alert
      data:
        message: "Kitchen tank is full. Auto stopping in 10 seconds."
        sound: kitchen_stopping_soon
        audio_duration: 6
        visual_duration: 10
    - delay: "00:00:10"
    - service: switch.turn_off
      target:
        entity_id: switch.kitchen_pump

# 4. KITCHEN: Full Auto Mode - Start on Empty
- id: 'kitchen_auto_start'
  alias: "Kitchen Full-Auto - Start on Empty"
  trigger:
    - platform: state
      entity_id: binary_sensor.top_tank_empty_float
      to: "on"
  condition:
    - condition: state
      entity_id: input_select.kitchen_pump_mode
      state: "Full-Auto"
    - condition: state
      entity_id: switch.kitchen_pump
      state: "off"
    # Quiet hours check (Do not start if it's currently quiet hours)
    - condition: not
      conditions:
        - condition: time
          after: input_datetime.quiet_hours_start
          before: input_datetime.quiet_hours_end
    # INTERLOCK GUARD: never make it three pumps at once. Checked here as well
    # as in the interlock automation so the motor is not started and then
    # stopped a second later.
    - condition: template
      value_template: >
        {{ ((1 if is_state('switch.bath_pump', 'on') else 0)
          + (1 if is_state('switch.utility_pump', 'on') else 0)) < 2 }}
    # Do not start into a dead mains
    - condition: state
      entity_id: binary_sensor.pump_mains_power
      state: "on"
  action:
    - service: script.system_alert
      data:
        message: "Kitchen tank is empty. Auto starting pump."
        sound: kitchen_auto_start
        audio_duration: 10
        visual_duration: 20
    - service: switch.turn_on
      target:
        entity_id: switch.kitchen_pump
    - service: notify.notify
      data:
        message: "Kitchen pump auto-started (Tank Empty)"

# 5. KITCHEN: Full Auto Mode - Stop on Full
- id: 'kitchen_auto_stop'
  alias: "Kitchen Full-Auto - Stop on Full"
  trigger:
    - platform: state
      entity_id: binary_sensor.top_tank_full_float
      to: "on"
  condition:
    - condition: state
      entity_id: input_select.kitchen_pump_mode
      state: "Full-Auto"
    - condition: state
      entity_id: switch.kitchen_pump
      state: "on"
  action:
    - service: script.system_alert
      data:
        message: "Kitchen tank is full. Auto stopping pump."
        sound: kitchen_auto_stop
        audio_duration: 10
        visual_duration: 20
    - service: switch.turn_off
      target:
        entity_id: switch.kitchen_pump
    - service: notify.notify
      data:
        message: "Kitchen pump auto-stopped (Tank Full)"


