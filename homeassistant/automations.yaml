        sound: bath_auto_start
        audio_duration: 10
        visual_duration: 20
    - service: switch.turn_on
      target:
        entity_id: switch.bath_pump
    - service: notify.notify
      data:
        message: "Bath pump auto-started (Tank Empty)"

