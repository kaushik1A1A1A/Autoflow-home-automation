# 9. BATH: Full Auto Mode - Start on Empty
- id: 'bath_auto_start'
  alias: "Bath Full-Auto - Start on Empty"
  trigger:
    - platform: state
      entity_id: binary_sensor.bottom_tank_empty_float
      to: "on"
  condition:
    - condition: state
      entity_id: input_select.bath_pump_mode
      state: "Full-Auto"
    - condition: state
      entity_id: switch.bath_pump
      state: "off"
    # Quiet hours check
    - condition: not
      conditions:
        - condition: time
          after: input_datetime.quiet_hours_start
          before: input_datetime.quiet_hours_end
    # INTERLOCK GUARD 1: the bath pump and the Utility pump may never run
    # together, so do not auto-start the bath pump while Utility is on.
    - condition: state
      entity_id: switch.utility_pump
      state: "off"
    # INTERLOCK GUARD 2: never make it three pumps at once.
    - condition: template
      value_template: >
        {{ ((1 if is_state('switch.kitchen_pump', 'on') else 0)
          + (1 if is_state('switch.utility_pump', 'on') else 0)) < 2 }}
    # Do not start into a dead mains
