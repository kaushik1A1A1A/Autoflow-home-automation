# Loads default set of integrations. Do not remove.
default_config:
tts:
  - platform: google_translate

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

command_line:
  # command_state makes Home Assistant read the REAL relay state every 30s
  # instead of assuming whatever it last commanded. Every safety automation
  # conditions on these switches, so they need to reflect hardware, not belief.
  # Requires the /relay/<id>/state endpoint in relay_api.py.
  # Watchdog report, added 21-Aug-2026.
  #
  # The watchdog runs on the HOST, outside Home Assistant, because the one
  # fault HA cannot report is its own death. It writes a JSON file; this reads
  # it and automation 40 mails the contents.
  #
  # `seq` only increments when something was actually repaired or gave up, so
  # a state change on this sensor is an unambiguous "there is news" signal.
  # Silence means healthy.
  - sensor:
      name: "Watchdog"
      command: "cat /config/watchdog_report.json"
      value_template: "{{ value_json.seq }}"
      json_attributes:
        - checked
        - healthy
        - acted
        - failed
      scan_interval: 60

  # Log summary, added 29-Aug-2026.
  #
  # Every fault this project has turned up was sitting in home-assistant.log
  # for weeks before anyone noticed. The information was never missing; it was
  # in a file nobody opens.
  #
  # log_summary.py counts the last 24 hours and describes it in plain English -
  # "Kitchen pump's power meter did not answer - 35 times" rather than
  # "pymodbus.logging No response received after 3 retries". The state is the
  # error count, so an automation can watch it climb.
  #
  # Anything unrecognised is passed through rather than hidden. A strange error
  # still reaches the screen, just without a friendly name.
  - sensor:
      name: "Log Summary"
      command: "python3 /config/log_summary.py"
      value_template: "{{ value_json.count }}"
      unit_of_measurement: "errors"
      json_attributes:
        - headline
        - summary
        - latest
        - latest_at
        - warnings
      scan_interval: 300

  # Kiosk lock state, added 29-Aug-2026.
  #
  # The screen is unlocked ON THE PANEL - six seconds of finger hold - so Home
  # Assistant has no way of knowing it happened. Without reading the state
  # back, the toggle would sit "on" over an unlocked screen indefinitely: the
  # UI and the hardware disagreeing, which is the same fault as a relay
  # reporting ON while dead.
  #
  # A missing file reads as unlocked. If the daemon is not running, the honest
  # answer is "not locked" - claiming locked while the touchscreen is live
  # would be the worse lie.
  - binary_sensor:
      name: "Kiosk Screen Locked"
      command: "cat /config/screenlock_state.txt 2>/dev/null || echo unlocked"
      payload_on: "locked"
      payload_off: "unlocked"
      scan_interval: 5

  - switch:
      name: "Kitchen Pump"
      command_on: "curl -s http://127.0.0.1:5000/relay/1/on"
      command_off: "curl -s http://127.0.0.1:5000/relay/1/off"
      command_state: "curl -s http://127.0.0.1:5000/relay/1/state"
      value_template: >
        {% if value | trim in ['0','1'] %}{{ value | trim == '1' }}
        {% else %}{{ is_state('switch.kitchen_pump', 'on') }}{% endif %}
      icon: mdi:water-pump
  - switch:
      name: "Bath Pump"
      command_on: "curl -s http://127.0.0.1:5000/relay/2/on"
      command_off: "curl -s http://127.0.0.1:5000/relay/2/off"
      command_state: "curl -s http://127.0.0.1:5000/relay/2/state"
      value_template: >
        {% if value | trim in ['0','1'] %}{{ value | trim == '1' }}
        {% else %}{{ is_state('switch.bath_pump', 'on') }}{% endif %}
      icon: mdi:water-pump
  - switch:
      name: "Utility Pump"
      command_on: "curl -s http://127.0.0.1:5000/relay/3/on"
      command_off: "curl -s http://127.0.0.1:5000/relay/3/off"
      command_state: "curl -s http://127.0.0.1:5000/relay/3/state"
      value_template: >
        {% if value | trim in ['0','1'] %}{{ value | trim == '1' }}
        {% else %}{{ is_state('switch.utility_pump', 'on') }}{% endif %}
      icon: mdi:water-pump
  # DVR internet gate. command_state added 18-Aug-2026.
  #
  # This switch had no state feedback, so it showed whatever it last
  # commanded. On 18-Aug the kernel had ip_forward=0 while the iptables rules
  # were still in place - the DVR had been cut off for hours and the dashboard
  # said nothing, because nothing was looking.
  #
  # /internet/state now reads the kernel directly and reports 1 only when
  # routing is enabled AND every rule is present. A half-open gate reads as
  # off, which is the truth: it passes no traffic.
  #
  # DEFAULT IS OFF, DELIBERATELY. The DVR takes its time from the Pi via
  # chrony, so the only thing it loses is the Hik-Connect cloud tunnel. Turn
  # this on when you want the phone app, and automation 37 turns it off again
  # after 30 minutes.
  - switch:
      name: "DVR Internet Access"
      icon: mdi:shield-lock
      command_on: "curl -s http://127.0.0.1:5000/internet/on"
      command_off: "curl -s http://127.0.0.1:5000/internet/off"
      command_state: "curl -s http://127.0.0.1:5000/internet/state"
      value_template: >
        {% if value | trim in ['0','1'] %}{{ value | trim == '1' }}
        {% else %}{{ is_state('switch.dvr_internet_access', 'on') }}{% endif %}

  # value_template hardened 17-Aug-2026.
  #
  # It used to be `{{ value == '1' }}`. That reads a failed poll as OFF: if the
  # curl times out or the API blips, `value` is an empty string, the comparison
  # is false, and Home Assistant concludes the relay is open. With current
  # still flowing, `<pump>_pump_external_start` then declares the pump was
  # started at the wall - a frightening and completely false alarm, seen while
  # the kitchen pump was running normally at 1.27 A.
  #
  # "The relay says off" and "the relay did not answer" are different facts and
  # must not collapse into the same state. Anything other than a clean 0 or 1
  # now holds the previous state instead of inventing a new one.

  # Relays 4-8. command_state added 16-Aug-2026.
  #
  # These five previously had command_on/off only, so Home Assistant showed
  # whatever it last commanded and never checked. Relays 5, 7 and 8 stopped
  # working at the pin and the dashboard went on showing them ON for weeks -
  # there was nothing anywhere that could have told you otherwise.
  #
  # relay_api.py reads the pin back rather than reporting what it wrote, so
  # a pin that refuses to change is reported honestly as off. With this in
  # place a dead channel now looks dead on the dashboard: you press it, it
  # springs back. That is the point.
  # Channel 4 is the enclosure exhaust fan as of 16-Aug-2026. It was on
  # channel 8 until GPIO 6 stopped being able to pull low; 4 is one of the two
  # channels still known good.
  #
  # Named for what it does rather than which channel it sits on. The next time
  # a channel is swapped the automations should not need to know.
  - switch:
      name: "Enclosure Fan"
      command_on: "curl -s http://127.0.0.1:5000/relay/4/on"
      command_off: "curl -s http://127.0.0.1:5000/relay/4/off"
      command_state: "curl -s http://127.0.0.1:5000/relay/4/state"
      value_template: >
        {% if value | trim in ['0','1'] %}{{ value | trim == '1' }}
        {% else %}{{ is_state('switch.enclosure_fan', 'on') }}{% endif %}
      icon: mdi:fan
  - switch:
      name: "Relay 5"
      command_on: "curl -s http://127.0.0.1:5000/relay/5/on"
      command_off: "curl -s http://127.0.0.1:5000/relay/5/off"
      command_state: "curl -s http://127.0.0.1:5000/relay/5/state"
      value_template: >
        {% if value | trim in ['0','1'] %}{{ value | trim == '1' }}
        {% else %}{{ is_state('switch.relay_5', 'on') }}{% endif %}
      icon: mdi:toggle-switch
  - switch:
      name: "Relay 6"
      command_on: "curl -s http://127.0.0.1:5000/relay/6/on"
      command_off: "curl -s http://127.0.0.1:5000/relay/6/off"
      command_state: "curl -s http://127.0.0.1:5000/relay/6/state"
      value_template: >
        {% if value | trim in ['0','1'] %}{{ value | trim == '1' }}
        {% else %}{{ is_state('switch.relay_6', 'on') }}{% endif %}
      icon: mdi:toggle-switch
  - switch:
      name: "Relay 7"
      command_on: "curl -s http://127.0.0.1:5000/relay/7/on"
      command_off: "curl -s http://127.0.0.1:5000/relay/7/off"
      command_state: "curl -s http://127.0.0.1:5000/relay/7/state"
      value_template: >
        {% if value | trim in ['0','1'] %}{{ value | trim == '1' }}
        {% else %}{{ is_state('switch.relay_7', 'on') }}{% endif %}
      icon: mdi:toggle-switch
  # KNOWN FAULTY 16-Aug-2026: GPIO 6 will not pull below ~1.1 V, so this
  # channel cannot switch. Left defined so the dashboard can show it as dead
  # rather than the entity simply vanishing. Same for relays 5 and 7.
  - switch:
      name: "Relay 8"
      command_on: "curl -s http://127.0.0.1:5000/relay/8/on"
      command_off: "curl -s http://127.0.0.1:5000/relay/8/off"
      command_state: "curl -s http://127.0.0.1:5000/relay/8/state"
      value_template: >
        {% if value | trim in ['0','1'] %}{{ value | trim == '1' }}
        {% else %}{{ is_state('switch.relay_8', 'on') }}{% endif %}
      icon: mdi:toggle-switch


modbus:
  # Serial ports are addressed by stable hardware ID, not by ttyACM number.
  # ttyACM assignment depends on the order Linux enumerates devices and has
  # already shuffled once (Volume 2, section C). The by-id path encodes the
  # converter's own serial number (BD653FABCD) and the physical channel on it
  # (if00/if02/if04/if06), so it cannot move.
  #   if02 = ttyACM1 = Kitchen   if04 = ttyACM2 = Utility   if06 = ttyACM3 = Bath
  - name: pzem_kitchen
    type: serial
    port: /hostdev/serial/by-id/usb-WCH.CN_USB_Quad_Serial_BD653FABCD-if02
    baudrate: 9600
    bytesize: 8
    method: rtu
    parity: N
    stopbits: 1
    sensors:
      - name: "Pump 1 Voltage"
        scan_interval: 10
        address: 0
        input_type: input
        slave: 1
        precision: 1
        data_type: uint16
        scale: 0.1
        # Corrupt Modbus frames were recording voltage in the
        # millions - RS-485 noise from the motor cabling. Clamped so a
        # mangled frame is bounded rather than absurd.
        min_value: 0
        max_value: 300
        unit_of_measurement: V
        device_class: voltage
      - name: "Pump 1 Current"
        scan_interval: 5
        address: 1
        input_type: input
        slave: 1
        precision: 3
        data_type: uint32
        swap: word
        scale: 0.001
        # Corrupt Modbus frames were recording current in the
        # millions - RS-485 noise from the motor cabling. Clamped so a
        # mangled frame is bounded rather than absurd.
        min_value: 0
        max_value: 30
        unit_of_measurement: A
        device_class: current
      - name: "Pump 1 Power"
        scan_interval: 5
        address: 3
        input_type: input
        slave: 1
        precision: 1
        data_type: uint32
        swap: word
        scale: 0.1
        # Corrupt Modbus frames were recording power in the
        # millions - RS-485 noise from the motor cabling. Clamped so a
        # mangled frame is bounded rather than absurd.
        min_value: 0
        max_value: 8000
        unit_of_measurement: W
        device_class: power
      # Renamed to _raw 23-Aug-2026. Energy is CUMULATIVE, so clamping is
      # the wrong tool - a running total pinned to a maximum is still
      # wrong, and the utility meters would carry the error forever.
      # The guarded template sensor "Pump 1 Energy" now takes this
      # entity_id and rejects implausible jumps.
      - name: "Pump 1 Energy Raw"
        scan_interval: 60
        address: 5
        input_type: input
        slave: 1
        precision: 3
        data_type: uint32
        swap: word
        scale: 0.001
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: "Pump 1 Frequency"
        scan_interval: 60
        address: 7
        input_type: input
        slave: 1
        precision: 1
        data_type: uint16
        scale: 0.1
        unit_of_measurement: Hz
        device_class: frequency
      - name: "Pump 1 Power Factor"
        scan_interval: 60
        address: 8
        input_type: input
        slave: 1
        precision: 2
        data_type: uint16
        scale: 0.01
        device_class: power_factor

  - name: pzem_bath
    type: serial
    port: /hostdev/serial/by-id/usb-WCH.CN_USB_Quad_Serial_BD653FABCD-if06
    baudrate: 9600
    bytesize: 8
    method: rtu
    parity: N
    stopbits: 1
    sensors:
      - name: "Pump 2 Voltage"
        scan_interval: 10
        address: 0
        input_type: input
        slave: 3
        precision: 1
        data_type: uint16
        scale: 0.1
        # Corrupt Modbus frames were recording voltage in the
        # millions - RS-485 noise from the motor cabling. Clamped so a
        # mangled frame is bounded rather than absurd.
        min_value: 0
        max_value: 300
        unit_of_measurement: V
        device_class: voltage
      - name: "Pump 2 Current"
        scan_interval: 5
        address: 1
        input_type: input
        slave: 3
        precision: 3
        data_type: uint32
        swap: word
        scale: 0.001
        # Corrupt Modbus frames were recording current in the
        # millions - RS-485 noise from the motor cabling. Clamped so a
        # mangled frame is bounded rather than absurd.
        min_value: 0
        max_value: 30
        unit_of_measurement: A
        device_class: current
      - name: "Pump 2 Power"
        scan_interval: 5
        address: 3
        input_type: input
        slave: 3
        precision: 1
        data_type: uint32
        swap: word
        scale: 0.1
        # Corrupt Modbus frames were recording power in the
        # millions - RS-485 noise from the motor cabling. Clamped so a
        # mangled frame is bounded rather than absurd.
        min_value: 0
        max_value: 8000
        unit_of_measurement: W
        device_class: power
      # Renamed to _raw 23-Aug-2026. Energy is CUMULATIVE, so clamping is
      # the wrong tool - a running total pinned to a maximum is still
      # wrong, and the utility meters would carry the error forever.
      # The guarded template sensor "Pump 2 Energy" now takes this
      # entity_id and rejects implausible jumps.
      - name: "Pump 2 Energy Raw"
        scan_interval: 60
        address: 5
        input_type: input
        slave: 3
        precision: 3
        data_type: uint32
        swap: word
        scale: 0.001
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: "Pump 2 Frequency"
        scan_interval: 60
        address: 7
        input_type: input
        slave: 3
        precision: 1
        data_type: uint16
        scale: 0.1
        unit_of_measurement: Hz
        device_class: frequency
      - name: "Pump 2 Power Factor"
        scan_interval: 60
        address: 8
        input_type: input
        slave: 3
        precision: 2
        data_type: uint16
        scale: 0.01
        device_class: power_factor

  - name: pzem_utility
    type: serial
    port: /hostdev/serial/by-id/usb-WCH.CN_USB_Quad_Serial_BD653FABCD-if04
    baudrate: 9600
    bytesize: 8
    method: rtu
    parity: N
    stopbits: 1
    sensors:
      - name: "Pump 3 Voltage"
        scan_interval: 10
        address: 0
        input_type: input
        slave: 2
        precision: 1
        data_type: uint16
        scale: 0.1
        # Corrupt Modbus frames were recording voltage in the
        # millions - RS-485 noise from the motor cabling. Clamped so a
        # mangled frame is bounded rather than absurd.
        min_value: 0
        max_value: 300
        unit_of_measurement: V
        device_class: voltage
      - name: "Pump 3 Current"
        scan_interval: 5
        address: 1
        input_type: input
        slave: 2
        precision: 3
        data_type: uint32
        swap: word
        scale: 0.001
        # Corrupt Modbus frames were recording current in the
        # millions - RS-485 noise from the motor cabling. Clamped so a
        # mangled frame is bounded rather than absurd.
        min_value: 0
        max_value: 30
        unit_of_measurement: A
        device_class: current
      - name: "Pump 3 Power"
        scan_interval: 5
        address: 3
        input_type: input
        slave: 2
        precision: 1
        data_type: uint32
        swap: word
        scale: 0.1
        # Corrupt Modbus frames were recording power in the
        # millions - RS-485 noise from the motor cabling. Clamped so a
        # mangled frame is bounded rather than absurd.
        min_value: 0
        max_value: 8000
        unit_of_measurement: W
        device_class: power
      # Renamed to _raw 23-Aug-2026. Energy is CUMULATIVE, so clamping is
      # the wrong tool - a running total pinned to a maximum is still
      # wrong, and the utility meters would carry the error forever.
      # The guarded template sensor "Pump 3 Energy" now takes this
      # entity_id and rejects implausible jumps.
      - name: "Pump 3 Energy Raw"
        scan_interval: 60
        address: 5
        input_type: input
        slave: 2
        precision: 3
        data_type: uint32
        swap: word
        scale: 0.001
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: "Pump 3 Frequency"
        scan_interval: 60
        address: 7
        input_type: input
        slave: 2
        precision: 1
        data_type: uint16
        scale: 0.1
